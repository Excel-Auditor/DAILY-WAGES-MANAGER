function vBal(){const c=calc(bf),bw=S.workers.includes(bf.worker)?bf.worker:'',so=(v,n)=>`<option value="${v}" ${bf.show===v?'selected':''}>${n}</option>`;let T={w:0,a:0,p:0,j:0,b:0};
 const rows=S.workers.filter(w=>(!bw||bw===w)&&(!hz||Object.values(c[w]).some(x=>x))&&(bf.show==='all'||(bf.show==='pay'&&c[w].b>0)||(bf.show==='adv'&&c[w].b<0)||(bf.show==='zero'&&c[w].b===0))).map(w=>{const o=c[w];for(const k in T)T[k]+=o[k];
  return `<tr><td>${h(w)}</td><td>${fmt(o.w)}</td><td>${fmt(o.a)}</td><td>${fmt(o.p)}</td><td>${fmt(o.j)}</td><td class="${o.b<0?'neg':''}"><b>${fmt(o.b)}</b></td></tr>`}).join('');
 return `<div class="card"><div class="row"><h2 style="margin:0;flex:1">Balance payable - ${h(R.biz.find(b=>b.id===R.cur).name)}</h2><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" ${hz?'checked':''} onchange="hz=this.checked;render()">Hide workers with no activity</label></div>
 <div class="row"><label>From<input type="date" value="${bf.from}" onchange="bf.from=this.value;render()"></label><label>To<input type="date" value="${bf.to}" onchange="bf.to=this.value;render()"></label><label>Worker<select onchange="bf.worker=this.value;render()"><option value="">All workers</option>${S.workers.map(w=>`<option ${w===bw?'selected':''}>${h(w)}</option>`).join('')}</select></label><label>Show<select onchange="bf.show=this.value;render()">${so('all','All')}${so('pay','Payable to worker (+)')}${so('adv','Paid ahead (−)')}${so('zero','Settled (0)')}</select></label><button class="btn s" onclick="mon()">This month</button><button class="btn s" onclick="bf={from:'',to:'',worker:'',show:'all'};render()">Clear filters</button></div>
 <div class="tw"><table><thead><tr><th class="l">Worker</th><th>Wages earned</th><th>Advance paid</th><th>Payments</th><th>Adjustments</th><th>Balance payable</th></tr></thead><tbody>${rows}</tbody>
 <tfoot><tr><td>Total</td><td>${fmt(T.w)}</td><td>${fmt(T.a)}</td><td>${fmt(T.p)}</td><td>${fmt(T.j)}</td><td>${fmt(T.b)}</td></tr></tfoot></table></div>
 <p class="mut">Balance = wages + adjustments − advances − payments. A negative (red) balance means the worker has been paid ahead of work done. With a date range, the figures cover only that period.</p></div>`}
function vWorks(){
 const chips=S.workers.map((w,i)=>`<button class="chip ${D.items[w]!=null?'on':''}" onclick="tog(${i})">${h(w)}</button>`).join('');
 const sel=S.workers.filter(w=>D.items[w]!=null).map(w=>`<label>${h(w)}<input type="number" value="${D.items[w]}" oninput="setAmt(${S.workers.indexOf(w)},this.value)"></label>`).join('');
 const list=[...S.works].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(k=>{const ws=Object.keys(k.items),t=ws.reduce((s,w)=>s+(+k.items[w]||0),0);
  return `<tr><td class="l">${h(k.date)}</td><td class="l wrap">${k.name?'<b>'+h(k.name)+'</b>':''}<div class="mut">${ws.map(w=>h(w)+' '+fmt(k.items[w])).join(' · ')}</div></td><td>${ws.length}</td><td>${fmt(t)}</td><td><button class="btn s" onclick="editW('${k.id}')">Edit</button> <button class="btn s d" onclick="delW('${k.id}')">${pend===k.id?'Tap again to confirm':'Delete'}</button></td></tr>`}).join('');
 return `<div class="card"><h2>Daily wages ${D.id?'(editing a saved day)':'(new day)'}</h2>
 <div class="row"><label>Date<input type="date" value="${D.date}" onchange="newD(this.value);render()"></label>
 <label style="flex:1;min-width:160px">Note / site (optional)<input value="${h(D.name)}" oninput="D.name=this.value" placeholder="e.g. Unicorn - Hyatt"></label>
 <label>Rate per worker<input type="number" style="width:110px" value="${D.rate}" oninput="D.rate=this.value"></label>
 <button class="btn" onclick="applyRate()">Apply rate to selected</button></div>
 <div class="mut">Tap to select the workers who worked on this date:</div><div class="chips">${chips||'<span class="mut">Add workers in the Workers tab first.</span>'}</div>
 <div class="row"><button class="btn s" onclick="selAll()">Select all</button><button class="btn s" onclick="D.items={};render()">Clear</button></div>
 ${sel?`<div class="sel">${sel}</div>`:''}
 <div class="row"><b>Total: <span id="tot">${fmt(Object.values(D.items).reduce((s,v)=>s+(+v||0),0))}</span></b><button class="btn p" onclick="saveW()">${D.id?'Update day':'Save day'}</button>${D.id?'<button class="btn" onclick="newD();render()">Back to today</button>':''}</div></div>
 <div class="card"><h2>Daily records (${S.works.length} days)</h2><div class="tw"><table><thead><tr><th class="l">Date</th><th class="l">Note &amp; workers</th><th>Workers</th><th>Total</th><th></th></tr></thead><tbody>${list}</tbody></table></div></div>`}
function tog(i){const w=S.workers[i];if(D.items[w]!=null)delete D.items[w];else D.items[w]=D.rate!==''?+D.rate:0;render()}
function setAmt(i,v){D.items[S.workers[i]]=v===''?0:+v;document.getElementById('tot').textContent=fmt(Object.values(D.items).reduce((s,x)=>s+(+x||0),0))}
function applyRate(){for(const w in D.items)D.items[w]=+D.rate||0;render()}
function selAll(){S.workers.forEach(w=>{if(D.items[w]==null)D.items[w]=+D.rate||0});render()}
function saveW(){const it={};for(const w in D.items)if(+D.items[w])it[w]=+D.items[w];
 if(!Object.keys(it).length)return alert('Select at least one worker with an amount');
 const o={id:D.id||uid(),date:D.date,name:D.name.trim(),items:it};const i=S.works.findIndex(k=>k.id===o.id);if(i>=0)S.works[i]=o;else S.works.push(o);save();newD(o.date);render()}
function editW(id){const k=S.works.find(x=>x.id===id);D={id:k.id,date:k.date,name:k.name,rate:'',items:{...k.items}};render();scrollTo(0,0)}
function delW(id){if(pend!==id){pend=id;render();return}S.works=S.works.filter(k=>k.id!==id);pend=null;if(D.id===id)newD(D.date);save();render()}
function vTx(){const opts=S.workers.map((w,i)=>`<option value="${i}" ${+Tf.worker===i?'selected':''}>${h(w)}</option>`).join('');
 const fo=['<option value="">All workers</option>'].concat(S.workers.map(w=>`<option ${fw===w?'selected':''}>${h(w)}</option>`)).join('');
 const list=S.tx.filter(t=>!fw||t.worker===fw).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<tr><td class="l">${h(t.date)}</td><td class="l">${h(t.worker)}</td><td class="l">${TT[t.type]}${t.mode?' · '+t.mode:''}</td><td class="${t.type==='adjustment'&&t.amt<0?'neg':''}">${fmt(t.amt)}</td><td class="l wrap">${h(t.note)}</td><td><button class="btn s d" onclick="delT('${t.id}')">Delete</button></td></tr>`).join('');
 const sv=(a,b)=>Tf.type===a&&Tf.mode===b?'selected':'';
 return `<div class="card"><h2>Add advance / payment / adjustment</h2><div class="row">
 <label>Date<input type="date" value="${Tf.date}" oninput="Tf.date=this.value"></label>
 <label>Worker<select onchange="Tf.worker=this.value">${opts}</select></label>
 <label>Type<select onchange="const[a,b]=this.value.split('|');Tf.type=a;Tf.mode=b"><option value="advance|cash" ${sv('advance','cash')}>Advance - Cash</option><option value="advance|bank" ${sv('advance','bank')}>Advance - Bank</option><option value="payment|cash" ${sv('payment','cash')}>Payment - Cash</option><option value="payment|bank" ${sv('payment','bank')}>Payment - Bank</option><option value="adjustment|" ${sv('adjustment','')}>Entry adjustment (+/−)</option></select></label>
 <label>Amount<input type="number" style="width:110px" value="${Tf.amt}" oninput="Tf.amt=this.value"></label>
 <label style="flex:1;min-width:120px">Note<input value="${h(Tf.note)}" oninput="Tf.note=this.value"></label>
 <button class="btn p" onclick="addT()">Add</button></div>
 <div class="mut">Adjustment: positive adds to what you owe the worker, negative reduces it.</div></div>
 <div class="card"><div class="row"><h2 style="margin:0;flex:1">Entries</h2><select onchange="fw=this.value;render()">${fo}</select></div>
 <div class="tw"><table><thead><tr><th class="l">Date</th><th class="l">Worker</th><th class="l">Type</th><th>Amount</th><th class="l">Note</th><th></th></tr></thead><tbody>${list}</tbody></table></div></div>`}
function addT(){const w=S.workers[+Tf.worker];if(!w||!+Tf.amt)return alert('Choose a worker and enter an amount');
 S.tx.push({id:uid(),date:Tf.date,worker:w,type:Tf.type,mode:Tf.mode,amt:+Tf.amt,note:Tf.note.trim()});Tf.amt='';Tf.note='';save();render()}
function delT(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function vWk(){return `<div class="card"><h2>Workers (${S.workers.length})</h2><div class="row"><label>New worker<input id="nw"></label><button class="btn p" onclick="addWk()">Add</button></div>
 <div class="chips">${S.workers.map((w,i)=>`<span class="chip">${h(w)} <a href="#" onclick="event.preventDefault();delWk(${i})" style="color:var(--neg);text-decoration:none">✕</a></span>`).join('')}</div></div>`}
function addWk(){const n=document.getElementById('nw').value.trim();if(!n||S.workers.includes(n))return;S.workers.push(n);save();render()}
function delWk(i){const w=S.workers[i];if(S.works.some(k=>k.items[w])||S.tx.some(t=>t.worker===w))return alert('This worker has entries, so cannot be removed.');S.workers.splice(i,1);save();render()}
function vData(){return `<div class="card"><h2>Backup &amp; export</h2><p class="mut">Data is saved in this browser. Copy a backup to keep it safe, or paste a backup below to restore.</p>
 <div class="row"><button class="btn" onclick="dataTxt=JSON.stringify(R);render()">Show backup of all businesses (JSON)</button><button class="btn" onclick="dataTxt=tsv();render()">Show sheet layout (paste into Excel)</button><button class="btn p" onclick="loadJ()">Restore from pasted backup</button></div>
 <textarea id="dt" oninput="dataTxt=this.value">${h(dataTxt)}</textarea></div>`}
function loadJ(){try{const o=JSON.parse(dataTxt);if(o.biz){if(!o.biz.length)throw 0}else if(!o.workers||!o.works||!o.tx)throw 0;if(pend!=='r'){pend='r';alert('Press the restore button again to replace all current data');return}pend=null;if(o.biz)R=o;else R.biz.find(b=>b.id===R.cur).data=o;pick();newD();save();render()}catch(e){alert('That is not a valid backup')}}
function tsv(){const W=S.workers,L=['Date\tParticulars\t'+W.join('\t')];
 [...S.works].sort((a,b)=>a.date.localeCompare(b.date)).forEach(k=>L.push(k.date+'\t'+k.name+'\t'+W.map(w=>k.items[w]||'').join('\t')));
 S.tx.forEach(t=>L.push(t.date+'\t'+TT[t.type]+(t.mode?' - '+t.mode:'')+(t.note?' ('+t.note+')':'')+'\t'+W.map(w=>t.worker===w?t.amt:'').join('\t')));
 const c=calc();L.push('\tBalance Payable\t'+W.map(w=>c[w].b).join('\t'));return L.join('\n')}
render();
</script></body></html>
